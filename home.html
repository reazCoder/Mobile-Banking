<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#F4F5F7] h-[100Vh]">
 <div class="max-w-lg mx-auto bg-white rounded-b-xl ">
       <div class="min-h-[50px] flex justify-between items-center  border-b-1 border-gray-400 p-3">
        <div class="flex">
            <img src="./assets/Group.png" class="h-[50px]" alt="">
            <div class="ml-3">
                <h2 class="font-bold">$ <span id="available-balance">45000</span></h2>
                <p class="text-[#08080880]">Available Balance</p>
            </div>

        </div>
        <div>
            <button class="btn text-[#08080880] font-bold rounded-lg  "><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i> Log Out</button>
        </div>

    </div>
    <div class=" mt-8 p-3">
        <h1 class="text-2xl font-bold">🔥 Welcome to Payooo!</h1>
        <p class="text-[#08080880]">Enjoy easy and convenient financial services with us.
            <br> Cashout charge is low and </p>
    </div>

    <div class=" min-h-[200px] grid grid-cols-3  gap-4 p-3">
        <div id="add-button" class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/wallet1.png" class="mx-auto" alt="">
            <h2>Add Money</h2>

        </div>
        <div id="cash-out-button" class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/send1.png" class="mx-auto" alt="">
            <h2>CashOut</h2>

        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/money1.png" class="mx-auto" alt="">
            <h2>Transfer Money</h2>

        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/bonus1.png" class="mx-auto" alt="">
            <h2>Get Bonus</h2>

        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/wallet1.png" class="mx-auto" alt="">
            <h2>Pay Bill</h2>

        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/transaction1.png" class="mx-auto" alt="">
            <h2>Transaction</h2>

        </div>

    </div>
  </div>
 <div class="all-form-section max-w-lg mx-auto">
    <!-- add money -->
    <div id="add-money-parent" >
        <h1 class="my-5 font-bold">Add Money</h1>
        <form action="" class=" bg-white rounded-2xl p-8">
            <div class="mb-3">
                <h1 class="font-bold">Select A Bank</h1>
              <select id="bank" class="select bg-[#f4f5f7] mt-3 rounded-2xl w-full">
                <option>Pick a Bank</option>
                <option>AB Bank</option>
                <option>IFIc Bank</option>
                <option>Dutch bangla Bank</option>
              </select>
            </div>
            <div>
                 <label class="font-bold" for="">Bank Account Number</label>
            <br>
            <input id="account-number" type="text" placeholder="Enter 11 digit account number"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <div class="mt-3">
                 <div>
                 <label class="font-bold " for="">Amount to Add</label>
            <br>
            <input id="add-amount" type="text" placeholder="Add Amount to withdraw"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <div class="mt-3">
                 <div>
                 <label class="font-bold " for="">Pin Number</label>
            <br>
            <input id="add-pin" type="text" placeholder="Enter 4 digit pin number"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <button id="add-money-btn" class="btn text-white font-bold bg-[#0874F2] mt-5 w-full rounded-2xl">Add Money</button>
        </form>
     </div>
    
    </div>
 </div>

 <!-- cash out -->

 <div id="cash-out-parent" style="display: none;">
      <h1 class="my-5 font-bold">Cash Out</h1> 
        <form action="" class=" bg-white rounded-2xl p-8">
           
            <div>
                 <label class="font-bold" for="">Agent Number</label>
            <br>
            <input id="withdraw-account-number"  type="text" placeholder="Enter 11 digit account number"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <div class="mt-3">
                 <div>
                 <label class="font-bold " for="">Amount</label>
            <br>
            <input id="withdraw-amount" type="text" placeholder="Enter Amount to withdraw"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <div class="mt-3">
                 <div>
                 <label class="font-bold " for="">Pin Number</label>
            <br>
            <input id="withdraw-pin" type="text" placeholder="Enter 4 digit pin number"  class="input bg-[#f4f5f7] mt-3 rounded-2xl w-full" />
            </div>
            <button id="withdraw-btn" class="btn text-white font-bold bg-[#0874F2] mt-5 w-full rounded-2xl">Withdraw Money</button>
        </form> 
    </div>
    
 <script src="./home.js"></script>
 
    
</body>
</html>
